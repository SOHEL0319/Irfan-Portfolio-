<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background rounded hexagon/squircle -->
  <rect width="64" height="64" rx="16" fill="#090d16" stroke="#1e293b" stroke-width="2" />
  <!-- Monogram MI with tech nodes -->
  <path d="M 16 46 L 16 20 L 26 34 L 36 20 L 36 46" fill="none" stroke="url(#grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <path d="M 46 20 L 46 46" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)" />
  <circle cx="46" cy="18" r="2.5" fill="#38bdf8" />
  <circle cx="26" cy="34" r="2" fill="#7dd3fc" />
</svg>
